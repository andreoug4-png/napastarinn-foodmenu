<style> /* Everything inside this section controls the appearance of the page. */

body {
font-family: "Bookman Old Style", sans-serif; /* Main writing style; sans-serif is the backup font. */
background: #5C4033; /* Brown background behind the menu. */
margin: 0; /* Removes the browser's automatic outside spacing. */
padding: 30px 20px; /* Adds 30px top/bottom and 20px left/right space. */
text-align: center; /* Centres text and buttons. */
}

.container {
max-width: 500px; /* Stops the menu becoming wider than 500 pixels. */
margin: auto; /* Places the menu box in the horizontal centre. */
background: #A07858; /* Lighter brown used inside the menu box. */
padding: 30px; /* Creates space between content and the box edges. */
border-radius: 15px; /* Rounds the corners of the menu box. */
box-shadow: 0 4px 15px rgba(0,0,0,0.15); /* Adds a soft shadow below the box. */
}

h1 {
margin-bottom: 10px; /* Leaves a small gap underneath headings and the logo. */
}

.menu {
display: flex; /* Activates the flexible layout system. */
flex-direction: column; /* Places the category buttons vertically. */
gap: 12px; /* Leaves 12 pixels between buttons. */
margin-top: 20px; /* Leaves space above a group of buttons. */
}

button {
padding: 15px; /* Makes buttons taller and easier to tap. */
font-size: 20px; /* Sets button text size. */
font-family: "Bookman Old Style", serif; /* Sets button font and its backup. */
font-weight: bold; /* Makes button text bold. */
border: none; /* Removes the standard browser border. */
border-radius: 10px; /* Rounds button corners. */
background: #5C4033; /* Gives buttons a dark-brown background. */
color: #E8E8E8; /* Gives buttons light text. */
cursor: pointer; /* Shows a hand cursor when a computer mouse is over a button. */
}

button:hover {
background: white; /* Changes the button background when the mouse is over it. */
color: #5C4033; /* Changes its text to brown so it remains readable. */
}

.back {
background: #777; /* Gives Back buttons a grey colour. */
margin-top: 25px; /* Leaves space above a Back button. */
}

.back:hover {
background: #555;
}

.hidden {
display: none; /* Completely hides a page section until JavaScript shows it. */
}

.category-note {
font-family: Georgia, serif;
font-size: 16px;
font-style: italic;
color: black;
margin: 5px 0 20px;
}


/* =========================
ITEM LAYOUT
Food and drinks both use one column.
========================= */

.food-grid {
display: grid; /* Uses a grid for menu-item cards. */
gap: 18px; /* Leaves space between cards. */
margin-top: 25px; /* Leaves space above the cards. */
}

.food-one-column {
grid-template-columns: 1fr; /* Food items appear one underneath another. */
}

.drinks-one-column {
grid-template-columns: 1fr; /* Drink items appear one underneath another. */
}

.food-item {
    background-color: #5C4033; /* Dark background of each food or drink card. */
    padding: 12px; /* Space inside each card. */
    border-radius: 10px; /* Rounded card corners. */
    margin: 0; /* The grid gap supplies spacing without causing mobile overflow. */
    color: #E8E8E8; /* Light writing inside each card. */
    min-width: 0; /* Allows the card to fit safely inside the grid. */
    box-sizing: border-box; /* Includes padding inside the card width. */
}


/* FOOD NAME */

.food-name {
font-family: "Georgia", serif;
font-size: 20px;
font-weight: bold;
margin-bottom: 8px;
}


/* FOOD DESCRIPTION */

.food-description {
font-family: Georgia, serif;
font-size: 15px;
font-weight: normal;
line-height: 1.5;
}

/* OPTIONAL FOOD IMAGE */

.food-image {
width: 100%; /* Makes the image use the width of its food card. */
max-height: 260px; /* Prevents very tall images from taking over the page. */
object-fit: cover; /* Crops the image neatly without stretching it. */
border-radius: 8px; /* Rounds the image corners. */
margin-bottom: 12px; /* Leaves space between the image and food name. */
display: block;
}


/* MOBILE */

@media (max-width: 400px) {

.food-grid {
gap: 12px;
}

.food-one-column {
grid-template-columns: 1fr; /* Food stays one column on mobile phones. */
}

.drinks-one-column {
grid-template-columns: 1fr; /* Drinks stay one column on mobile phones. */
}

.food-name {
font-size: 16px;
}

.food-description {
font-size: 13px;
}
}

</style>

let currentMenuType = "food"; // Remembers whether the visitor is currently browsing food or drinks.
let currentDrinkCategory = null; // Remembers Beers or Wines while a visitor browses its subcategories.

function showCategories(type) { // Runs after a visitor presses Food or Drinks; type contains that choice.
currentMenuType = type; // Saves the visitor's choice for use on the next screen.
currentDrinkCategory = null; // Clears an older beer/wine selection whenever Drinks is reopened.
document.getElementById("mainMenu").classList.add("hidden"); // Finds and hides the first screen.
document.getElementById("categoryMenu").classList.remove("hidden"); // Finds and shows the category screen.

const foodButtons = document.getElementById("originalFoodButtons"); // Saves a reference to the food buttons.
const drinkButtons = document.getElementById("drinkCategoryButtons"); // Saves a reference to the drinks button box.
foodButtons.classList.toggle("hidden", type !== "food"); // Hides food categories unless Food was selected.
drinkButtons.classList.toggle("hidden", type !== "drinks"); // Hides drink categories unless Drinks was selected.

if (type === "drinks") { // Only performs the following work when Drinks was chosen.
createDrinkCategoryButtons(drinksMenu); // Creates the top-level drinks buttons.
}
}

function createDrinkCategoryButtons(categories) { // Creates buttons from any supplied category collection.
const drinkButtons = document.getElementById("drinkCategoryButtons"); // Finds the drink-button area.
drinkButtons.innerHTML = ""; // Clears old buttons so levels do not mix.
Object.keys(categories).forEach(category => { // Repeats once for every supplied category name.
const button = document.createElement("button"); // Creates a new button in memory.
button.textContent = category; // Writes the category name on that new button.
button.onclick = () => selectCategory(category); // Makes the button open its category when pressed.
drinkButtons.appendChild(button); // Places the finished button on the visible webpage.
});
}

function goBackFromCategories() { // Controls Back while browsing drink-category levels.
if (currentMenuType === "drinks" && currentDrinkCategory !== null) { // Checks whether the visitor is inside Beers or Wines.
currentDrinkCategory = null; // Forgets the selected parent category.
createDrinkCategoryButtons(drinksMenu); // Shows the main drink categories again.
return; // Stops here instead of returning to the Food/Drinks screen.
}
goBackToMain(); // If there is no subcategory level, returns to Food/Drinks.
}

function goBackToMain() { // Runs when the Back button on the category screen is pressed.
document.getElementById("categoryMenu").classList.add("hidden"); // Hides the category screen.
document.getElementById("mainMenu").classList.remove("hidden"); // Shows the Food/Drinks screen again.
}

  "Cocktails": "All cocktails — €7.00",

function selectCategory(category) { // Receives the name of the category the visitor pressed.

if (currentMenuType === "drinks" && currentDrinkCategory === null && !Array.isArray(drinksMenu[category])) { // Detects a category containing subcategories.
currentDrinkCategory = category; // Remembers Beers or Wines.
createDrinkCategoryButtons(drinksMenu[category]); // Shows its subcategory buttons.
return; // Stops before trying to show products.
}

document.getElementById("categoryMenu") // Finds the category screen...
.classList.add("hidden"); // ...and hides it.

document.getElementById("foodMenu") // Finds the item-list screen...
.classList.remove("hidden"); // ...and shows it.

document.getElementById("selectedCategory") // Finds the empty heading on the item-list screen...
.textContent = category; // ...and writes the selected category name into it.

document.getElementById("categoryNote")
.textContent = categoryNotes[category] || "";

createFoodItems(category); // Calls the function that creates all item cards for this category.
}


// =========================
// CREATE FOOD ITEMS
// =========================

function createFoodItems(category) { // Builds the visible cards for one selected category.

const container = // Creates a short name for...
document.getElementById("foodButtons"); // ...the box that will receive all item cards.

container.innerHTML = ""; // Removes cards from the previously visited category.

// Food and Drinks both use one column.
container.className = currentMenuType === "food"
? "food-grid food-one-column"
: "food-grid drinks-one-column";

const selectedItems = currentMenuType === "food" // Starts choosing the correct list of products.
? foodMenu[category] // Uses a food category if Food is active.
: currentDrinkCategory === null // Otherwise checks if this is a top-level drink category.
? drinksMenu[category] // Uses its direct list, for example Cocktails.
: drinksMenu[currentDrinkCategory][category]; // Or uses a nested list, for example Beers then Draught.

selectedItems.forEach(food => { // Repeats the following commands for every item in the chosen list.

const item = document.createElement("div"); // Creates one new card.

item.className = "food-item"; // Applies the .food-item appearance defined in CSS.

// Creates an image only when the item has an image property.
// encodeURI helps image addresses containing spaces work correctly.
const imageHtml = food.image
? `<img class="food-image" src="${encodeURI(food.image)}" alt="${food.name}">`
: "";

item.innerHTML = `

${imageHtml}

<div class="food-name">
${food.name}
</div>

<div class="food-description">
${food.description}
</div>

`;

container.appendChild(item); // Adds the completed card to the visible grid.

});

}


// =========================
// BACK TO CATEGORIES
// =========================

function goBackToCategories() { // Runs when Back is pressed on an item-list screen.

document.getElementById("foodMenu") // Finds the item-list screen...
.classList.add("hidden"); // ...and hides it.

document.getElementById("categoryMenu") // Finds the category screen...
.classList.remove("hidden"); // ...and shows it again.

}
