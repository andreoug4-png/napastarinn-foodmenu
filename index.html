/* =========================
WHOLE PAGE
========================= */

body {

/* =========================
MAIN CONTAINER
========================= */

.container {

LOGO
========================= */

}

HEADINGS
========================= */

}


h2 {

    letter-spacing: 0.8px;

    font-size: 25px;

}


/* =========================
MENU BUTTON LAYOUT
========================= */

.menu {

    display: flex;

    flex-direction: column;

    gap: 12px;

    margin-top: 20px;

}


/* =========================
BUTTONS
========================= */

button {

    padding: 15px;

    font-size: 20px;

    font-family: "Roboto Condensed", sans-serif;

    font-weight: 700;

    letter-spacing: 0.6px;

    border: none;

    border-radius: 10px;

    background: #5C4033;

    color: #F2F2F2;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;

}


button:hover {

    background: #F2C14E;

    color: #2C1B14;

    transform: translateY(-2px);

    box-shadow: 0 4px 10px rgba(0,0,0,0.25);

}


/* =========================
BACK BUTTON
========================= */

.back {

    background: #3B302B;

    color: white;

    margin-top: 25px;

}


.back:hover {

    background: #F2C14E;

    color: #2C1B14;

}


/* =========================
HIDDEN SECTIONS
========================= */

.hidden {

    display: none;

}


/* =========================
CATEGORY NOTE
========================= */

.category-note {

    font-family: "Roboto Slab", serif;

    font-size: 15px;

    font-weight: 500;

    font-style: italic;

    color: #2C1B14;

    margin: 5px 0 20px;

}


/* =========================
ITEM GRID
========================= */

.food-grid {

    display: grid;

    gap: 18px;

    margin-top: 25px;

}


.food-one-column {

    grid-template-columns: 1fr;

}


.drinks-one-column {

    grid-template-columns: 1fr;

}


/* =========================
ITEM CARD
========================= */

.food-item {

    background-color: #5C4033;

    padding: 14px;

    border-radius: 10px;

    color: #F2F2F2;

    min-width: 0;

    box-sizing: border-box;

    box-shadow: 0 3px 10px rgba(0,0,0,0.16);

/* =========================
FOOD / DRINK NAME
========================= */

.food-name {

    font-family: "Roboto Condensed", sans-serif;

    font-size: 21px;

    font-weight: 700;

    margin-bottom: 8px;

    color: #F2C14E;

/* =========================
DESCRIPTION
========================= */

FOOD IMAGE
========================= */

MOBILE
========================= */

function chooseLanguage(language) {

    currentLanguage = language;


    document
    .getElementById("languageMenu")
    .classList.add("hidden");


    document
    .getElementById("mainMenu")
    .classList.remove("hidden");


    if (language === "gr") {

        document.documentElement.lang = "el";


        document
        .getElementById("foodMainButton")
        .textContent = "Φαγητό";


        document
        .getElementById("drinksMainButton")
        .textContent = "Ποτά";


        document
        .getElementById("languageBackButton")
        .textContent = "← Γλώσσα";


        document
        .getElementById("categoryBackButton")
        .textContent = "← Πίσω";


        document
        .getElementById("itemBackButton")
        .textContent = "← Πίσω";

    }

    else {

        document.documentElement.lang = "en";


        document
        .getElementById("foodMainButton")
        .textContent = "Food";


        document
        .getElementById("drinksMainButton")
        .textContent = "Drinks";


        document
        .getElementById("languageBackButton")
        .textContent = "← Language";


        document
        .getElementById("categoryBackButton")
        .textContent = "← Back";


        document
        .getElementById("itemBackButton")
        .textContent = "← Back";

    }

}

// =====================================================
// SHOW FOOD OR DRINK CATEGORIES
// =====================================================

function showCategories(type) {

    currentMenuType = type;

    currentDrinkCategory = null;


    document
    .getElementById("mainMenu")
    .classList.add("hidden");


    document
    .getElementById("categoryMenu")
    .classList.remove("hidden");


    const foodButtons =
    document.getElementById("originalFoodButtons");


    const drinkButtons =
    document.getElementById("drinkCategoryButtons");


    foodButtons.classList.toggle(
        "hidden",
        type !== "food"
    );


    drinkButtons.classList.toggle(
        "hidden",
        type !== "drinks"
    );


    if (type === "food") {

        createFoodCategoryButtons();

    }


    if (type === "drinks") {

        createDrinkCategoryButtons(drinksMenu);

    }

}

    const foodButtons =
    document.getElementById("originalFoodButtons");


    foodButtons.innerHTML = "";


    Object.keys(foodMenu).forEach(category => {


        const button =
        document.createElement("button");


        if (currentLanguage === "gr") {

            button.textContent =
            foodCategoryTranslations[category] || category;

        }

        else {

            if (category === "Breakfast") {

                button.textContent =
                "Breakfast until 16:00";

            }

            else {

                button.textContent =
                category;

            }

        }


        button.onclick =
        () => selectCategory(category);


        foodButtons.appendChild(button);

    });

}



// =====================================================
// CREATE DRINK CATEGORY BUTTONS
// =====================================================

function createDrinkCategoryButtons(categories) {

    const drinkButtons =
    document.getElementById("drinkCategoryButtons");


    drinkButtons.innerHTML = "";


    Object.keys(categories).forEach(category => {


        const button =
        document.createElement("button");


        if (currentLanguage === "gr") {

            button.textContent =
            drinkCategoryTranslations[category] || category;

        }

        else {

            button.textContent = category;

        }


        button.onclick =
        () => selectCategory(category);


        drinkButtons.appendChild(button);

    });

}



// =====================================================
// SELECT CATEGORY
// =====================================================

function selectCategory(category) {


    /*
    If the visitor clicks:
    Beers
    Spirits
    Wines

    show another category level first.
    */

    if (
        currentMenuType === "drinks" &&
        currentDrinkCategory === null &&
        !Array.isArray(drinksMenu[category])
    ) {

        currentDrinkCategory = category;


        createDrinkCategoryButtons(
            drinksMenu[category]
        );


        return;

    }


    document
    .getElementById("categoryMenu")
    .classList.add("hidden");


    document
    .getElementById("foodMenu")
    .classList.remove("hidden");


    let displayedCategory = category;


    if (currentLanguage === "gr") {

        if (currentMenuType === "food") {

            displayedCategory =
            foodCategoryTranslations[category] || category;

        }

        else {

            displayedCategory =
            drinkCategoryTranslations[category] || category;

        }

    }


    document
    .getElementById("selectedCategory")
    .textContent = displayedCategory;



    const note =
    currentLanguage === "gr"
    ? categoryNotesGreek[category]
    : categoryNotes[category];


    document
    .getElementById("categoryNote")
    .textContent = note || "";


    createFoodItems(category);

}



// =====================================================
// CREATE FOOD / DRINK CARDS
// =====================================================

function createFoodItems(category) {


    const container =
    document.getElementById("foodButtons");


    container.innerHTML = "";


    container.className =
    currentMenuType === "food"
    ? "food-grid food-one-column"
    : "food-grid drinks-one-column";


    let selectedItems;



    if (currentMenuType === "food") {


        if (currentLanguage === "gr") {

            selectedItems =
            foodMenuGreek[category];

        }

        else {

            selectedItems =
            foodMenu[category];

        }

    }


    else {


        if (currentDrinkCategory === null) {

            selectedItems =
            drinksMenu[category];

        }

        else {

            selectedItems =
            drinksMenu[currentDrinkCategory][category];

        }

    }



    if (!selectedItems) {

        container.innerHTML =
        "<p>Menu items could not be loaded.</p>";

        return;

    }



    selectedItems.forEach(food => {


        const item =
        document.createElement("div");


        item.className =
        "food-item";


        const imageHtml =
        food.image
        ? `

        <img
        class="food-image"
        src="${food.image}"
        alt="${food.name}">

        `
        : "";


        item.innerHTML = `

        ${imageHtml}

        <div class="food-name">

            ${food.name}

        </div>


        <div class="food-description">

            ${food.description}

        </div>

        `;


        container.appendChild(item);

    });

}



// =====================================================
// BACK FROM ITEM SCREEN
// =====================================================

function goBackToCategories() {


    document
    .getElementById("foodMenu")
    .classList.add("hidden");


    document
    .getElementById("categoryMenu")
    .classList.remove("hidden");

}



// =====================================================
// BACK FROM CATEGORY SCREEN
// =====================================================

function goBackFromCategories() {


    /*
    If inside Beers / Spirits / Wines,
    return to the main Drinks categories.
    */

    if (
        currentMenuType === "drinks" &&
        currentDrinkCategory !== null
    ) {


        currentDrinkCategory = null;


        createDrinkCategoryButtons(drinksMenu);


        return;

    }


    document
    .getElementById("categoryMenu")
    .classList.add("hidden");


    document
    .getElementById("mainMenu")
    .classList.remove("hidden");

}


</script>
