<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#2b1205">

<title>Napa Star Inn Sports Schedule</title>

<style>

:root {
    --bg-dark: #170901;
    --bg-brown: #2b1205;
    --bg-brown-light: #4a2208;

    --gold: #f2c149;
    --gold-light: #fff1a8;

    --red: #d61d1d;
    --red-dark: #9f0f0f;

    --white: #f5f5f5;
    --muted: #e3d9ce;
}


/* =====================================
   GENERAL
   ===================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
}


body {

    font-family: Arial, Helvetica, sans-serif;

    min-height: 100svh;

    color: var(--white);

    padding:
        max(14px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

    background:

        linear-gradient(
            rgba(15, 6, 1, 0.74),
            rgba(15, 6, 1, 0.86)
        ),

        radial-gradient(
            circle at center top,
            rgba(255, 194, 57, 0.12),
            transparent 40%
        ),

        linear-gradient(
            180deg,
            #5b2a08 0%,
            #341705 42%,
            #1b0b02 100%
        );

    background-attachment: fixed;
}


button {

    font: inherit;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;
}


.container {

    width: min(100%, 850px);

    margin: 0 auto;
}


.panel {

    background: rgba(30, 12, 4, 0.68);

    border:
        1px solid rgba(242, 193, 73, 0.28);

    border-radius: 24px;

    box-shadow:
        0 16px 36px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

    backdrop-filter: blur(4px);
}



/* =====================================
   HOME PAGE
   ===================================== */

#daySelection {

    padding: clamp(22px, 5vw, 40px);

    text-align: center;
}


.logo {

    margin: 0 auto 18px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.logo img {

    display: block;

    width: min(100%, 420px);

    height: auto;

    max-height: 180px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 8px 18px rgba(0, 0, 0, 0.45)
        );
}


.schedule-title {

    font-size: clamp(28px, 8vw, 42px);

    line-height: 1.05;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    color: #efefef;

    text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.45),
        1px 1px 0 #111;

    margin-bottom: 10px;
}


.subtitle {

    font-size: clamp(13px, 3.5vw, 15px);

    line-height: 1.45;

    color: var(--muted);

    margin: 0 auto 18px;

    max-width: 520px;
}


.gold-line {

    width: 100%;

    height: 3px;

    margin: 16px 0 22px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255, 194, 57, 0),
            var(--gold),
            var(--gold-light),
            var(--gold),
            rgba(255, 194, 57, 0)
        );

    box-shadow:
        0 0 14px rgba(255, 193, 73, 0.5);
}


.select-title {

    text-align: center;

    font-size: 14px;

    color: var(--gold);

    letter-spacing: 1px;

    margin-bottom: 16px;

    text-transform: uppercase;

    font-weight: 800;
}


.days {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}


.day-button {

    min-height: 58px;

    border:
        1px solid rgba(242, 193, 73, 0.35);

    border-radius: 15px;

    padding: 15px 14px;

    background:
        linear-gradient(
            180deg,
            var(--bg-brown-light),
            var(--bg-brown)
        );

    color: var(--white);

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    text-transform: uppercase;

    letter-spacing: 0.45px;

    transition:
        transform 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;

    box-shadow:
        0 7px 16px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
}


.day-button:hover,
.day-button:focus-visible {

    transform: translateY(-2px);

    background:
        linear-gradient(
            180deg,
            var(--red),
            var(--red-dark)
        );

    border-color: var(--gold);

    outline: none;
}



/* =====================================
   DAY PAGE
   ===================================== */

#dayPage {

    display: none;
}


.day-header {

    padding:
        clamp(20px, 5vw, 28px)
        18px
        18px;

    text-align: center;

    margin-bottom: 16px;
}


.day-header h1 {

    font-size: clamp(28px, 8vw, 38px);

    line-height: 1.05;

    font-weight: 900;

    letter-spacing: 1.5px;

    color: #efefef;

    text-transform: uppercase;

    text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.45),
        1px 1px 0 #111;
}


.day-header .gold-line {

    margin: 12px 0 0;
}


#events {

    display: flex;

    flex-direction: column;

    gap: 14px;
}



/* =====================================
   DEFAULT LEAGUE BOX
   ===================================== */

.event {

    position: relative;

    background:
        rgba(46, 19, 7, 0.9);

    border:
        1px solid rgba(242, 193, 73, 0.24);

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
}


.league {

    position: relative;

    z-index: 2;

    text-align: center;

    padding: 13px 14px;

    font-size: clamp(17px, 5vw, 22px);

    font-weight: 900;

    color: var(--gold);

    text-transform: uppercase;

    letter-spacing: 0.8px;

    background:
        rgba(0, 0, 0, 0.14);

    border-bottom:
        1px solid rgba(242, 193, 73, 0.18);

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.35);
}


.match {

    position: relative;

    z-index: 2;

    padding: 14px 14px 16px;

    text-align: center;
}



/* =====================================
   MATCH ROW
   TEAMS PERFECTLY CENTRED
   ===================================== */

.match-row {

    position: relative;

    display: grid;

    /*
       Only the two teams + VS are part
       of the main centred grid.

       LIVE and TIME are positioned
       separately on the right.
    */

    grid-template-columns:
        minmax(0, 1fr)
        34px
        minmax(0, 1fr);

    align-items: center;

    column-gap: 8px;

    width: 100%;

    /*
       Equal empty space on BOTH sides
       keeps the match perfectly centred.
    */

    padding: 10px 115px;
}


.match-row + .match-row {

    border-top:
        1px solid rgba(255, 255, 255, 0.10);
}



/* =====================================
   TEAM NAMES
   ===================================== */

.home-team,
.away-team {

    min-width: 0;

    font-size:
        clamp(14px, 3.8vw, 20px);

    font-weight: 900;

    color: #f0f0f0;

    text-transform: uppercase;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.48);

    line-height: 1.12;
}


.home-team {

    text-align: right;
}


.away-team {

    text-align: left;
}


.vs {

    text-align: center;

    font-size: 12px;

    color: var(--gold);

    font-weight: 900;
}



/* =====================================
   LIVE BADGE
   ===================================== */

.live-badge {

    position: absolute;

    right: 62px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-height: 38px;

    background:
        linear-gradient(
            180deg,
            #ff3131,
            #c91010
        );

    color: #ffffff;

    padding: 7px 13px;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 900;

    text-transform: uppercase;

    white-space: nowrap;

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 6px 16px rgba(0, 0, 0, 0.28);
}



/* =====================================
   TIME
   ===================================== */

.time {

    position: absolute;

    right: 5px;

    width: 52px;

    text-align: center;

    font-size: 18px;

    font-weight: 900;

    color: #ffffff;

    letter-spacing: 0.3px;

    white-space: nowrap;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.45);
}



/* =====================================
   CHAMPIONS LEAGUE
   ===================================== */

.champions-box {

    background-image:
        url(
        "https://i.ibb.co/cdzTt0b/IMG-1824.jpg"
        );

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    border:
        1px solid rgba(242, 193, 73, 0.42);
}


.champions-box::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(3, 13, 57, 0.56),
            rgba(1, 10, 45, 0.72)
        );

    z-index: 1;

    pointer-events: none;
}


.champions-box .league {

    background:
        rgba(0, 14, 71, 0.38);

    border-bottom:
        1px solid rgba(242, 193, 73, 0.32);

    color: #ffd85f;
}


.champions-box .match {

    background: transparent;
}


.champions-box
.match-row + .match-row {

    border-top:
        1px solid rgba(255, 255, 255, 0.15);
}



/* =====================================
   EUROPA LEAGUE
   ===================================== */

.europa-box {

    background-image:
        url(
        "https://i.ibb.co/xKgWXrPb/IMG-1828.png"
        );

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    border:
        1px solid rgba(242, 193, 73, 0.42);
}


.europa-box::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(85, 35, 5, 0.58),
            rgba(45, 17, 2, 0.76)
        );

    z-index: 1;

    pointer-events: none;
}


.europa-box .league {

    background:
        rgba(70, 25, 0, 0.38);

    border-bottom:
        1px solid rgba(242, 193, 73, 0.32);

    color: #ffd85f;
}


.europa-box .match {

    background: transparent;
}


.europa-box
.match-row + .match-row {

    border-top:
        1px solid rgba(255, 255, 255, 0.15);
}



/* =====================================
   CONFERENCE LEAGUE
   ===================================== */

.conference-box {

    background-image:
        url(
        "https://i.ibb.co/TB4WX6x8/IMG-1829.jpg"
        );

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    border:
        1px solid rgba(242, 193, 73, 0.42);
}


.conference-box::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(5, 55, 35, 0.58),
            rgba(2, 25, 17, 0.76)
        );

    z-index: 1;

    pointer-events: none;
}


.conference-box .league {

    background:
        rgba(0, 55, 35, 0.38);

    border-bottom:
        1px solid rgba(242, 193, 73, 0.32);

    color: #ffd85f;
}


.conference-box .match {

    background: transparent;
}


.conference-box
.match-row + .match-row {

    border-top:
        1px solid rgba(255, 255, 255, 0.15);
}



/* =====================================
   EMPTY DAY MESSAGE
   ===================================== */

.no-events {

    display: none;

    padding: 26px 18px;

    text-align: center;

    line-height: 1.45;

    color: #f2e6d5;

    background:
        rgba(46, 19, 7, 0.9);

    border:
        1px solid rgba(242, 193, 73, 0.24);

    border-radius: 20px;

    box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.34);
}


.no-events strong {

    color: var(--gold);
}



/* =====================================
   BACK BUTTON
   ===================================== */

.back-button {

    width: 100%;

    min-height: 56px;

    margin-top: 18px;

    padding: 15px;

    border:
        1px solid rgba(242, 193, 73, 0.35);

    border-radius: 14px;

    background:
        linear-gradient(
            180deg,
            var(--bg-brown-light),
            var(--bg-brown)
        );

    color: #ffffff;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.18s ease;

    text-transform: uppercase;

    letter-spacing: 0.4px;
}


.back-button:hover,
.back-button:focus-visible {

    background:
        linear-gradient(
            180deg,
            var(--red),
            var(--red-dark)
        );

    color: #f8e29b;

    border-color: var(--gold);

    outline: none;
}



/* =====================================
   PHONE OPTIMISATION
   ===================================== */

@media (max-width: 640px) {

    body {

        background-attachment: scroll;
    }


    .panel {

        border-radius: 20px;
    }


    #daySelection {

        padding: 24px 16px;
    }


    .logo img {

        width:
            min(100%, 330px);

        max-height: 150px;
    }


    .days {

        grid-template-columns: 1fr;

        gap: 10px;
    }


    .day-button {

        width: 100%;

        font-size: 16px;
    }


    .event {

        border-radius: 18px;
    }


    .match {

        padding:
            10px 7px 12px;
    }


    /*
       CENTRED MOBILE MATCH
    */

    .match-row {

        grid-template-columns:
            minmax(0, 1fr)
            20px
            minmax(0, 1fr)
            auto
            auto;

        column-gap: 7px;

        padding: 10px 8px;
    }


    .home-team,
    .away-team {

        font-size: clamp(11px, 3.2vw, 15px);

        white-space: normal;

        overflow-wrap: anywhere;
    }


    .vs {

        font-size: 9px;
    }


    .live-badge {

        position: static;

        right: auto;

        min-height: 30px;

        padding: 5px 7px;

        border-radius: 8px;

        font-size: 10px;
    }


    .time {

        position: static;

        right: auto;

        width: auto;

        min-width: 39px;

        font-size: 13px;

        text-align: right;
    }
}



/* =====================================
   VERY SMALL PHONES
   ===================================== */

@media (max-width: 380px) {

    body {

        padding-left: 8px;

        padding-right: 8px;
    }


    .match-row {

        grid-template-columns:
            minmax(0, 1fr)
            17px
            minmax(0, 1fr)
            auto
            auto;

        column-gap: 4px;

        padding: 9px 5px;
    }


    .home-team,
    .away-team {

        font-size: 10px;
    }


    .live-badge {

        position: static;

        right: auto;

        min-height: 27px;

        padding: 4px 5px;

        font-size: 8.5px;
    }


    .time {

        position: static;

        right: auto;

        width: auto;

        min-width: 34px;

        font-size: 10.5px;

        text-align: right;
    }
}

</style>
</head>


<body>

<div class="container">


<!-- =====================================
     HOME PAGE
     ===================================== -->

<div id="daySelection" class="panel">


    <div class="logo">

        <img
            src="https://i.ibb.co/MDTvBjw5/Napastar-logo.png"
            alt="Napa Star Inn Logo"
        >

    </div>


    <h1 class="schedule-title">

        LIVE Sports Schedule

    </h1>


    <p class="subtitle">

    </p>


    <div class="gold-line"></div>


    <div class="select-title">

    </div>


    <div class="days">


        <button
            class="day-button"
            onclick="showDay('Monday')"
        >
            Monday 14/9
        </button>


        <button
            class="day-button"
            onclick="showDay('Tuesday')"
        >
            Tuesday 15/9
        </button>


        <button
            class="day-button"
            onclick="showDay('Wednesday')"
        >
            Wednesday 16/9
        </button>


        <button
            class="day-button"
            onclick="showDay('Thursday')"
        >
            Thursday 17/9
        </button>


        <button
            class="day-button"
            onclick="showDay('Friday')"
        >
            Friday 18/9
        </button>


        <button
            class="day-button"
            onclick="showDay('Saturday')"
        >
            Saturday 19/9
        </button>


        <button
            class="day-button"
            onclick="showDay('Sunday')"
        >
            Sunday 13/9
        </button>


    </div>

</div>



<!-- =====================================
     DAY PAGE
     ===================================== -->

<div id="dayPage">


    <div class="day-header panel">

        <h1 id="dayTitle"></h1>

        <div class="gold-line"></div>

    </div>



    <div id="events">

            <!-- =====================================
             MONDAY 14/9
             ===================================== -->    

<div class="event monday-event">
        
        <div class="league">

                PREMIER LEAGUE

            </div>


            <div class="match">


                <div class="match-row">

                    <div class="home-team">
                        LEEDS
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="away-team">
                        NEWCASTLE
                    </div>

                    <span class="live-badge">
                        LIVE
                    </span>

                    <span class="time">
                        22:00
                    </span>

                </div>
        </div>

</div>


        <!-- =====================================
             TUESDAY 15/9
             ===================================== -->

        <!-- =====================================
             WEDNESDAY 16/9
             ===================================== -->



        <!-- =====================================
             THURSDAY 17/9
             ===================================== -->

        


        <!-- =====================================
             FRIDAY 18/9
             ===================================== -->

        

         <!-- =====================================
             SATURDAY 19/9
             ===================================== -->

       

        <!-- =====================================
             SUNDAY 13/9
             ===================================== -->

        <div class="event sunday-event">
        
        <div class="league">

                SCOTTISH LEAGUE CUP

            </div>


            <div class="match">


                <div class="match-row">

                    <div class="home-team">
                        RANGERS
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="away-team">
                        CELTIC
                    </div>

                    <span class="live-badge">
                        LIVE
                    </span>

                    <span class="time">
                        14:00
                    </span>

                </div>
        </div>

</div>

        <div class="event sunday-event">

            <div class="league">

                Premier League

            </div>


            <div class="match">


                <div class="match-row">

                    <div class="home-team">
                        COVENTRY
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="away-team">
                        BRIGHTON
                    </div>

                    <span class="live-badge">
                        LIVE
                    </span>

                    <span class="time">
                        16:00
                    </span>

                </div>



                <div class="match-row">

                    <div class="home-team">
                        MAN.UTD
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="away-team">
                        MAN.CITY
                    </div>

                    <span class="live-badge">
                        LIVE
                    </span>

                    <span class="time">
                        18:30
                    </span>

                </div>

                </div>
    
        </div>
    
     </div>
            

    <!-- =====================================
         NO EVENTS MESSAGE
         ===================================== -->

    <div
        id="noEventsMessage"
        class="no-events"
    >

        <strong>
            No matches added
        </strong>

        for this day yet.

    </div>



    <!-- =====================================
         BACK BUTTON
         ===================================== -->

    <button
        class="back-button"
        onclick="goBack()"
    >

        ← Back to Days

    </button>


</div>

</div>



<script>


function showDay(day) {


    document
        .getElementById("daySelection")
        .style.display = "none";


    document
        .getElementById("dayPage")
        .style.display = "block";


    document
        .getElementById("dayTitle")
        .textContent =
            day.toUpperCase();



    const allEvents =
        document.querySelectorAll(".event");


    allEvents.forEach(
        function(event) {

            event.style.display =
                "none";

        }
    );



    const selectedEvents =
        document.querySelectorAll(
            "." +
            day.toLowerCase() +
            "-event"
        );


    selectedEvents.forEach(
        function(event) {

            event.style.display =
                "block";

        }
    );



    const noEventsMessage =
        document.getElementById(
            "noEventsMessage"
        );


    noEventsMessage.style.display =
        selectedEvents.length === 0
            ? "block"
            : "none";



    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



function goBack() {


    document
        .getElementById("dayPage")
        .style.display =
            "none";


    document
        .getElementById("daySelection")
        .style.display =
            "block";


    document
        .getElementById("noEventsMessage")
        .style.display =
            "none";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


</script>

</body>
