body {

}

.container {
    max-width: 500px;

    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1 {

}

h2 {

}

.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

button {
    padding: 15px;
    font-size: 17px;
    font-family: "Bookman Old Style", serif;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #5C4033;
    color: #E8E8E8;
    cursor: pointer;
}

button:hover {
    background: white;
}

.back {
    background: #777;
    margin-top: 20px;
}

.back:hover {
    background: #555;
}

.hidden {
    display: none;
}

#result {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
}

/* DISH NAME */

.dish-name {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* DISH DESCRIPTION */

.dish-description {
    font-size: 17px;
    font-weight: normal;
    font-family: Georgia;
    line-height: 1.6;
    color: black;
}

/* DISH IMAGE */
.dish-image {
    width: 100%;
    max-width: 400px;
    height: 250px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 20px;
}



</style>

// =========================
// SELECT CATEGORY
// =========================

function selectCategory(category) {

    document.getElementById("categoryMenu")
        .classList.add("hidden");

    document.getElementById("foodMenu")
        .classList.remove("hidden");

    document.getElementById("selectedCategory")
        .textContent = category;

    createFoodButtons(category);
}


// =========================
// CREATE FOOD BUTTONS
// =========================

function createFoodButtons(category) {

    const container =
        document.getElementById("foodButtons");

    container.innerHTML = "";

    foodMenu[category].forEach(food => {

        const button =
            document.createElement("button");

        button.textContent = food.name;

        button.onclick = function() {

            selectFood(food);

        };

        container.appendChild(button);

    });
}


// =========================
// SELECT FOOD
// =========================

function selectFood(food) {

    document.getElementById("foodMenu")
        .classList.add("hidden");

    document.getElementById("resultMenu")
        .classList.remove("hidden");

    document.getElementById("result")
        .innerHTML = `

        <div class="dish-name">
            ${food.name}
        </div>

        <div class="dish-description">
            ${food.description}
        </div>
        <img class="dish-image"
            src="${food.image}"
        >
    `;
}


// =========================
// BACK TO CATEGORIES
// =========================

function goBackToCategories() {

    document.getElementById("foodMenu")
        .classList.add("hidden");

    document.getElementById("resultMenu")
        .classList.add("hidden");

    document.getElementById("categoryMenu")
        .classList.remove("hidden");
}
